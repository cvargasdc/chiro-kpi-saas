name: Deploy staging

# Manual only. Do not auto-deploy from main until environment protection
# and OIDC are configured. This workflow is a spine, not a live deploy.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy-staging to confirm"
        required: true
        default: ""

