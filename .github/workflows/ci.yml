name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test-check-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      # Do not dump the database or upload backups from CI.
      # GitHub is not a BAA vendor; keep ePHI out of Actions artifacts.
